status: frozen_before_focused_neural_matrix
purpose: Diagnose the low-success pipeline before choosing a non-temporal mainline.
success_metric: official_peak_per_object
repeats_in_screen: 1
selection_rule_after_screen: validation_success_then_lift_then_failure; repeat top candidates later

data:
  train_root: dexgrasp/dataset/bc_multicategory_train
  valid_root: dexgrasp/dataset/bc_multicategory_valid
  objects:
    bottle_dc005:
      object_id: core-bottle-dc005c019fbfb32c90071898148dca0e
      train_trajectories: 32
      valid_trajectories: 8
      train_selection: custom_tools/configs/focused_bottle_dc005_train_all.yaml
      valid_selection: custom_tools/configs/focused_bottle_dc005_valid_all.yaml
    mug_b4ae:
      object_id: core-mug-b4ae56d6638d5338de671f28c83d2dcb
      train_trajectories: 31
      valid_trajectories: 8
      train_selection: custom_tools/configs/focused_mug_b4ae_train_all.yaml
      valid_selection: custom_tools/configs/focused_mug_b4ae_valid_all.yaml
    camera_82819:
      object_id: core-camera-82819e1201d2dc583a3e53900c6cbba
      train_trajectories: 30
      valid_trajectories: 8
      train_selection: custom_tools/configs/focused_camera_82819_train_all.yaml
      valid_selection: custom_tools/configs/focused_camera_82819_valid_all.yaml

shared_candidates:
  official_bc:
    checkpoint: ActionDiffusion/bc/saved_models/1obj_seq2000_DexRep_pro100_start_uniform_vis_action_dsam_mod/last.ckpt
    role: Official provided starting checkpoint.
  shared_clean:
    checkpoint: custom_tools/runs/bc/multicategory_bc_warmstart_seed2025_e100/epoch=099-step=21600.ckpt
    role: Official initialization fine-tuned on all 395 trajectories without observation noise.
  shared_noise005:
    checkpoint: custom_tools/runs/bc/multicategory_bc_noise005_seed2025_e100/epoch=039-step=8640.ckpt
    role: Same shared data with independent +/-0.05 proprioceptive noise.
  bc_soup:
    checkpoint: custom_tools/runs/bc/model_soups/noise005_s2025_s2026_weighted2to1.ckpt
    role: Two noise005 epoch-40 seeds averaged with weights 2:1.
  offline_unified_student:
    checkpoint: custom_tools/runs/bc/unified_student_routed_t70_demo30_seed2025_e40_v1/epoch=039-step=8640.ckpt
    role: One network distilled from the routed category teachers on demonstration states.
  online_unified_student:
    checkpoint: custom_tools/runs/bc/unified_student_online_r1_noisefix_seed2025_e20_v1/epoch=004-step=2140.ckpt
    role: Corrected-noise unified student after one online imitation aggregation round.

object_candidates:
  bottle_dc005:
    category_expert:
      checkpoint: custom_tools/runs/bc/category_expert_bottle_noise005_soup_seed2025_e40_v1/epoch=039-step=2560.ckpt
      role: Soup fine-tuned on the four bottle training objects.
    focused_expert:
      checkpoint: custom_tools/runs/bc/focused_bottle_dc005_lr5e5_seed2025_e40_v1/epoch=019-step=340.ckpt
      role: Bottle category expert fine-tuned only on this object's 32 train trajectories.
  mug_b4ae:
    category_expert:
      checkpoint: custom_tools/runs/bc/category_expert_mug_noise005_soup_seed2025_e40_v1/epoch=009-step=570.ckpt
      role: Soup fine-tuned on the four mug training objects.
    focused_expert:
      checkpoint: custom_tools/runs/bc/focused_mug_b4ae_lr1e5_seed2025_e40_v1/epoch=019-step=320.ckpt
      role: Mug category expert fine-tuned only on this object's 31 train trajectories.
  camera_82819:
    category_expert:
      checkpoint: custom_tools/runs/bc/category_expert_camera_noise005_soup_seed2025_e40_v1/epoch=009-step=500.ckpt
      role: Soup fine-tuned on the four camera training objects.
    focused_expert:
      checkpoint: custom_tools/runs/bc/focused_camera_82819_lr1e5_seed2025_e40_v1/epoch=019-step=320.ckpt
      role: Camera category expert fine-tuned only on this object's 30 train trajectories.

causal_questions:
  - shared_clean vs official_bc: Does multicategory fine-tuning help?
  - shared_noise005 vs shared_clean: Does observation noise reduce closed-loop shift?
  - bc_soup vs shared_noise005: Does seed averaging improve robustness?
  - category_expert vs bc_soup: Does category specialization reduce gradient conflict?
  - focused_expert vs category_expert: Does object specialization help or overfit?
  - offline_unified_student vs routed category experts: How much is lost by distillation?
  - online_unified_student vs offline_unified_student: Does online imitation recover closed-loop performance?
