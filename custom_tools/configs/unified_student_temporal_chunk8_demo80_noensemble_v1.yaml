# 消融：模型仍预测8步动作块，但推理时只执行当前预测，不融合重叠动作块。
seed: 2025
name: train_lhm_bc
exp_dir: ../custom_tools/runs/bc
run_name: unified_student_temporal_chunk8_demo80_noensemble_v1

train_data_dir: /home/lekangwan/projects/DexGraspMotionChallenge2025/dexgrasp/dataset/scaled_bc20_train_v1
test_data_dir: /home/lekangwan/projects/DexGraspMotionChallenge2025/dexgrasp/dataset/scaled_bc20_valid_v1
batch_size: 128
num_epochs: 4
seq_num: 1726
val_seq_num: 434
category_balanced_sampling: true
object_balanced_sampling: false
add_noise: true
noise_val: 0.05
obs_type: dexrep
seq_normalize: true
num_frame: 70
batch_seq_flat: true
start_frame_pad: false
use_sim_action: false
infer_clip_sample: true
lr: 2e-5
obs_dim: 100
horizon: 1
obj_glob_feat_file: ./object_code_glob_feat.npy

task_conditioning:
  enabled: true
  categories: [bottle, mug, bowl, camera]
temporal_history:
  enabled: true
  history_frames: 3
  prop_dim: 100
  action_dim: 28
action_chunk_aux:
  enabled: true
  horizon: 8
  auxiliary_weight: 1.0
action_chunk_execution:
  enabled: false
  temporal_ensemble_decay: 0.2
distillation:
  enabled: true
  teacher_action_file: /home/lekangwan/projects/DexGraspMotionChallenge2025/custom_tools/data/distillation/routed_teacher_scaled20_standard_train1726.npz
  online_action_file: /home/lekangwan/projects/DexGraspMotionChallenge2025/custom_tools/data/distillation/online_taskid_scaled20_r1_r2_aggregated.npz
  teacher_weight: 0.2
  demo_weight: 0.8
online_sample_fraction: 0.25
policy:
  actor_critic: ActorCriticDexRep
  pi_hid_sizes: [1024, 1024, 512, 512]
  vf_hid_sizes: [1024, 1024, 512, 512]
  activation: elu
  actions_shape: 28
encoder:
  freeze: false
  emb_dim: 128
  n_obs_steps: 1
  bn_type: part
learn:
  init_noise_std: 0.8
