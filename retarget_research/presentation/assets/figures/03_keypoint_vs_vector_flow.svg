   <g id="text_1">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:22px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 50.4, 46.732656)" x="50.4" y="46.732656">两种轨迹重定向方法的计算逻辑</text>
   </g>
   <g id="text_2">
    <text style="fill:#66717d;font-family:Noto Sans CJK JP;font-size:11px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 51.84, 72.237813)" x="51.84" y="72.237813">共同目标：逐帧求出目标手的手腕位姿和关节角</text>
   </g>
   <g id="text_3">
    <text style="fill:#4e5965;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 336.96, 113.498672)" x="336.96" y="113.498672">共同输入：Shadow Hand当前帧</text>
   </g>
   <g id="text_4">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 336.96, 135.565875)" x="336.96" y="135.565875">28维轨迹帧 → 正向运动学（FK） → 源手空间几何</text>
   </g>
   <g id="text_5">
    <text style="fill:#332288;font-family:Noto Sans CJK JP;font-size:15px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 59.04, 198.72)" x="59.04" y="198.72">a  关键点法</text>
   </g>
   <g id="text_6">
    <text style="fill:#66717d;font-family:Noto Sans CJK JP;font-size:9.5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 194.4, 201.346602)" x="194.4" y="201.346602">XHand / WujiHand</text>
   </g>
   <g id="text_7">
    <text style="fill:#228c7b;font-family:Noto Sans CJK JP;font-size:15px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 517.68, 198.72)" x="517.68" y="198.72">b  功能向量法</text>
   </g>
   <g id="text_8">
    <text style="fill:#66717d;font-family:Noto Sans CJK JP;font-size:9.5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 685.44, 201.412656)" x="685.44" y="201.412656">LinkerHand O6</text>
   </g>
   <g id="text_9">
    <text style="fill:#332288;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 73.44, 243.818672)" x="73.44" y="243.818672">提取目标数据</text>
   </g>
   <g id="text_10">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(73.44 265.885875)">掌心、指节、指尖</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(73.44 276.167344)">共15个语义点</text>
   </g>
   <g id="text_11">
    <text style="fill:#332288;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 272.16, 243.818672)" x="272.16" y="243.818672">计算目标手当前值</text>
   </g>
   <g id="text_12">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(272.16 265.885875)">候选手腕+关节角 → FK</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(272.16 276.167344)">得到对应的15个点</text>
   </g>
   <g id="text_13">
    <text style="fill:#332288;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 115.92, 333.818672)" x="115.92" y="333.818672">计算误差</text>
   </g>
   <g id="text_14">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(115.92 355.885875)">15对点的平均平方距离 × 1000</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(115.92 366.167344)">+ 相邻帧关节/手腕变化惩罚</text>
   </g>
   <g id="text_15">
    <text style="fill:#332288;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 115.92, 427.0875)" x="115.92" y="427.0875">SLSQP反复调整</text>
   </g>
   <g id="text_16">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(115.92 448.765875)">改变目标手的手腕位姿和关节角</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(115.92 459.047344)">直到对应点尽量重合</text>
   </g>
   <g id="text_17">
    <text style="fill:#332288;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 254.88, 486)" x="254.88" y="486">输出：目标手当前帧动作</text>
   </g>
   <g id="text_18">
    <text style="fill:#228c7b;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 532.08, 243.818672)" x="532.08" y="243.818672">构造Shadow目标</text>
   </g>
   <g id="text_19">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(532.08 265.885875)">10条位置向量</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(532.08 276.167344)">5条单位方向向量</text>
   </g>
   <g id="text_20">
    <text style="fill:#228c7b;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 737.28, 243.818672)" x="737.28" y="243.818672">适配Linker尺寸</text>
   </g>
   <g id="text_21">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(737.28 265.885875)">用零姿态长度比例</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(737.28 276.167344)">缩放位置向量</text>
   </g>
   <g id="text_22">
    <text style="fill:#228c7b;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 551.52, 333.818672)" x="551.52" y="333.818672">计算Linker当前值和误差</text>
   </g>
   <g id="text_23">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(551.52 355.885875)">FK得到当前向量；Huber比较长度与方向</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(551.52 366.167344)">+ 掌心、接触锚、抓紧和相邻帧约束</text>
   </g>
   <g id="text_24">
    <text style="fill:#228c7b;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 551.52, 427.0875)" x="551.52" y="427.0875">SLSQP反复调整</text>
   </g>
   <g id="text_25">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(551.52 448.765875)">改变Linker手腕和6个主动量</text>
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:8.4px;font-style:normal;font-weight:normal;" transform="translate(551.52 459.047344)">优先恢复指尖对置与包覆</text>
   </g>
   <g id="text_26">
    <text style="fill:#228c7b;font-family:Noto Sans CJK JP;font-size:10.5px;font-style:normal;font-weight:bold;text-anchor:middle;" transform="rotate(-0, 712.8, 486)" x="712.8" y="486">输出：Linker当前帧动作</text>
   </g>
   <g id="text_27">
    <text style="fill:#20252b;font-family:Noto Sans CJK JP;font-size:10.2px;font-style:normal;font-weight:normal;text-anchor:middle;" transform="rotate(-0, 485.28, 529.92)" x="485.28" y="529.92">关键区别：关键点法追求“对应位置接近”；向量法追求“尺寸适配后的方向、对置和抓取功能接近”。</text>
   </g>
  </g>
 </g>
