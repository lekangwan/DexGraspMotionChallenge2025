# Focused specialist initialized from the existing camera-category expert.
seed: 2025

name: train_lhm_bc
exp_dir: ../custom_tools/runs/bc
run_name: focused_specialist_camera_82819
checkpoint_every_n_epochs: 10
check_val_every_n_epoch: 1

train_data_dir: ./dataset/bc_multicategory_train
test_data_dir: ./dataset/bc_multicategory_valid
train_obj_code_list:
  - core-camera-82819e1201d2dc583a3e53900c6cbba
val_obj_code_list:
  - core-camera-82819e1201d2dc583a3e53900c6cbba

batch_size: 128
num_epochs: 40
seq_num: 30
val_seq_num: 40
category_balanced_sampling: false

add_noise: true
noise_val: 0.05
obs_type: dexrep
seq_normalize: true
num_frame: 70
batch_seq_flat: true
start_frame_pad: false
use_sim_action: false
infer_clip_sample: true

lr: 0.00001
obs_dim: 100
horizon: 1
obj_glob_feat_file: ./object_code_glob_feat.npy

policy:
  actor_critic: ActorCriticDexRep
  pi_hid_sizes: [1024, 1024, 512, 512]
  vf_hid_sizes: [1024, 1024, 512, 512]
  activation: elu
  actions_shape: 28

encoder:
  freeze: true
  emb_dim: 128
  n_obs_steps: 1
  bn_type: part

learn:
  init_noise_std: 0.8
