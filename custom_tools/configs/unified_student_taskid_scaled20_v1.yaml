# Unified student with an explicit four-way category Task ID.
seed: 2025

name: train_lhm_bc
exp_dir: ../custom_tools/runs/bc
run_name: unified_student_taskid_scaled20_v1
checkpoint_every_n_epochs: 5
check_val_every_n_epoch: 1

train_data_dir: ./dataset/scaled_bc20_train_v1
test_data_dir: ./dataset/scaled_bc20_valid_v1
train_obj_code_list: null
val_obj_code_list: null

batch_size: 128
num_epochs: 20
seq_num: 1726
val_seq_num: 434
# This balances the four tasks while training one student.  It does not alter
# or select the category teachers.
category_balanced_sampling: true
object_balanced_sampling: false

add_noise: true
noise_val: 0.05
obs_type: dexrep
seq_normalize: true
num_frame: 70
batch_seq_flat: true
start_frame_pad: false
use_sim_action: false
infer_clip_sample: true

lr: 5e-5
obs_dim: 100
horizon: 1
obj_glob_feat_file: ./object_code_glob_feat.npy

task_conditioning:
  enabled: true
  categories: [bottle, mug, bowl, camera]

distillation:
  enabled: true
  teacher_action_file: ../custom_tools/data/distillation/routed_teacher_scaled20_standard_train1726.npz
  teacher_weight: 0.70
  demo_weight: 0.30

policy:
  actor_critic: ActorCriticDexRep
  pi_hid_sizes: [1024, 1024, 512, 512]
  vf_hid_sizes: [1024, 1024, 512, 512]
  activation: elu
  actions_shape: 28

encoder:
  freeze: false
  emb_dim: 128
  n_obs_steps: 1
  bn_type: part

learn:
  init_noise_std: 0.8
