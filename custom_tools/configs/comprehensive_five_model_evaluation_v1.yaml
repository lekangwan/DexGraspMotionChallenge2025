status: locked_reporting_protocol
purpose: >
  Compare the five serial policy nodes on seen-object held-out trajectories,
  development objects, and final unseen objects without further model selection.
primary_metric: object_macro_official_peak_success_rate
simulation_seeds: [2025, 2026, 2027]

splits:
  seen80:
    role: seen-object generalization
    object_count: 80
    trajectory_count_per_seed: 434
    description: >
      All 80 optimizer-training object instances, evaluated on trajectories
      excluded from optimizer updates.
    model_selection_allowed: false
  development12:
    role: checkpoint selection history
    object_count: 12
    trajectory_count_per_seed: 313
    description: >
      Unseen object instances used during checkpoint and hyperparameter
      selection. Results are selection-biased and are not final test evidence.
    model_selection_allowed: false
  final8:
    role: final unseen-object generalization
    object_count: 8
    trajectory_count_per_seed: 216
    description: >
      Unseen object instances reserved for final reporting. They have now been
      accessed, so these results may not be used for new model selection.
    model_selection_allowed: false

models:
  - label: official_bc
    display_name: Official BC
    checkpoint: custom_tools/runs/bc/official_bc_scaled20_matched_seed2025_e100_v1/epoch=079-step=75440.ckpt
