status: frozen_before_serial_repeat
purpose: Locate the largest loss in the single serial teacher-student pipeline.
data:
  train_root: dexgrasp/dataset/bc_multicategory_train
  valid_root: dexgrasp/dataset/bc_multicategory_valid
  objects:
    bottle_dc005:
      train_selection: custom_tools/configs/focused_bottle_dc005_train_all.yaml
      valid_selection: custom_tools/configs/focused_bottle_dc005_valid_all.yaml
      routed_teacher: custom_tools/runs/bc/category_expert_bottle_noise005_soup_seed2025_e40_v1/epoch=039-step=2560.ckpt
    mug_b4ae:
      train_selection: custom_tools/configs/focused_mug_b4ae_train_all.yaml
      valid_selection: custom_tools/configs/focused_mug_b4ae_valid_all.yaml
      # The locked routed pool deliberately retained Soup for mug.
      routed_teacher: custom_tools/runs/bc/model_soups/noise005_s2025_s2026_weighted2to1.ckpt
    camera_82819:
      train_selection: custom_tools/configs/focused_camera_82819_train_all.yaml
      valid_selection: custom_tools/configs/focused_camera_82819_valid_all.yaml
      routed_teacher: custom_tools/runs/bc/category_expert_camera_noise005_soup_seed2025_e40_v1/epoch=009-step=500.ckpt
nodes:
  base_soup:
    checkpoint: custom_tools/runs/bc/model_soups/noise005_s2025_s2026_weighted2to1.ckpt
    meaning: Shared two-seed noise-BC parameter average before category specialization.
  routed_teacher:
    checkpoint: per_object
    meaning: Fixed category-routed teacher that generated the distillation labels.
  offline_student:
    checkpoint: custom_tools/runs/bc/unified_student_routed_t70_demo30_seed2025_e40_v1/epoch=039-step=8640.ckpt
    meaning: One shared network trained on offline states with 70% teacher and 30% demonstration targets.
  online_student_r1:
    checkpoint: custom_tools/runs/bc/unified_student_online_r1_noisefix_seed2025_e20_v1/epoch=004-step=2140.ckpt
    meaning: Offline student after one corrected-noise online imitation aggregation round.
edges:
  - base_soup_to_routed_teacher
  - routed_teacher_to_offline_student
  - offline_student_to_online_student_r1
